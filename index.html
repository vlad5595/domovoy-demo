<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Глэмпинг «Лесная поляна» — путеводитель гостя</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏡</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=PT+Serif:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2ec;--card:#fff;--ink:#1f3326;--ink2:#3c5143;--muted:#6b7d6f;--line:#d6dfd7;--pine:#2f5d43;--pine-s:#e1ece3;--wood:#b8692f;--wood-s:#f7ebe0;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 120px}
.demo{background:var(--wood-s);color:#7a4518;font-size:12.5px;text-align:center;padding:7px 12px}
.hero{padding:26px 0 14px}
.kind{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0}
h1{font-family:'PT Serif',Georgia,serif;font-size:clamp(30px,8vw,42px);line-height:1.05;margin:6px 0 6px;color:var(--pine)}
.place{color:var(--muted);font-size:14px;margin:0 0 14px}
.welcome{font-size:15.5px;line-height:1.5;color:var(--ink2);margin:0}
.houses{display:flex;gap:8px;overflow-x:auto;padding:16px 0 4px;scrollbar-width:none}
.houses button{flex:0 0 auto;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:9px 16px;cursor:pointer;font-size:14.5px;font-weight:500}
.houses button.on{background:var(--pine);border-color:var(--pine);color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 15px}
.card.wide{grid-column:1/-1}
.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 6px}
.big{font-size:17px;font-weight:600;margin:0}
.wifi{background:var(--pine);color:#fff;border:0}
.wifi .lbl{color:#bcd3c3}.wifi .pass{font-size:22px;font-weight:700;letter-spacing:.02em;margin:2px 0 10px;word-break:break-all}
.wifi .ssid{font-size:14px;color:#d6e6da;margin:0}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:600;cursor:pointer;font-size:15px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.light{background:#fff;color:var(--pine)}.btn.pine{background:var(--pine);color:#fff}.btn.wood{background:var(--wood);color:#fff}
.btn.ghost{background:var(--pine-s);color:var(--pine)}
.btn.tg{background:#2aabee;color:#fff}.btn.mx{background:#5b3fd9;color:#fff}
.btn svg{width:18px;height:18px;flex:0 0 auto}
.live{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:0 16px 14px;font-size:13.5px;color:var(--muted)}
.live .btn{padding:8px 12px;font-size:14px;border-radius:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.note{background:var(--wood-s);border-color:#efd8c2;font-size:14.5px;line-height:1.45;color:#5e3a17}
h2{font-size:21px;margin:30px 0 4px}
.sub{color:var(--muted);font-size:14px;margin:0 0 12px}
.svc{display:grid;gap:8px}
.svc .item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 12px 12px 15px}
.svc .t{flex:1;min-width:0}.svc b{display:block;font-size:15.5px}.svc span{font-size:13px;color:var(--muted)}
.svc .p{font-weight:700;color:var(--wood);white-space:nowrap;font-size:15px}
.search{width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:13px 15px;font-size:16px;margin:4px 0 12px}
.search:focus{outline:none;border-color:var(--pine)}
details{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;overflow:hidden}
summary{cursor:pointer;list-style:none;padding:15px 16px;font-weight:600;font-size:16px;display:flex;justify-content:space-between;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:'+';font-size:22px;color:var(--muted);line-height:1}
details[open] summary::after{content:'–'}
details ul{margin:0;padding:0 16px 14px 34px}
details li{margin:0 0 8px;line-height:1.5;font-size:15px;color:var(--ink2)}
mark{background:#ffe9a8;border-radius:3px;padding:0 2px}
.empty{color:var(--muted);font-size:14px;padding:6px 2px}
.reviews{display:grid;gap:8px;margin-top:8px}
footer{text-align:center;color:var(--muted);font-size:12.5px;margin-top:36px}
footer b{color:var(--pine)}
/* чат */
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--pine);color:#fff;border:0;border-radius:999px;padding:14px 20px;font-weight:600;font-size:15.5px;box-shadow:0 10px 28px -8px rgba(31,51,38,.55);cursor:pointer;z-index:20}
.sheet-bg{position:fixed;inset:0;background:rgba(20,32,24,.45);z-index:30;display:none}
.sheet-bg.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:720px;margin:0 auto;background:var(--bg);border-radius:20px 20px 0 0;z-index:31;max-height:88vh;display:none;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.open{display:flex}
.sh-top{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 8px}
.sh-top b{font-size:17px}.x{border:0;background:none;font-size:26px;line-height:1;color:var(--muted);cursor:pointer}
.msgs{flex:1;overflow-y:auto;padding:4px 16px 8px;display:flex;flex-direction:column;gap:8px;min-height:180px}
.m{max-width:86%;padding:10px 13px;border-radius:16px;font-size:15px;line-height:1.45}
.m.me{align-self:flex-end;background:var(--pine);color:#fff;border-bottom-right-radius:4px}
.m.bot{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.sugg{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 8px}
.sugg button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-size:13.5px;cursor:pointer}
.inp{display:flex;gap:8px;padding:8px 16px 14px}
.inp input{flex:1;border:1.5px solid var(--line);border-radius:12px;padding:12px 13px;font-size:16px;background:var(--card)}
.inp input:focus{outline:none;border-color:var(--pine)}
.form{padding:0 16px 18px;overflow-y:auto}
.form label{display:block;font-size:13.5px;font-weight:600;margin:12px 0 6px}
.form input,.form textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px;font-size:16px;background:var(--card)}
.form textarea{min-height:70px;resize:vertical}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 13px;font-size:14px;cursor:pointer}
.chips button.on{border-color:var(--pine);background:var(--pine-s);color:var(--pine);font-weight:600}
.ok{background:var(--pine-s);border-radius:14px;padding:14px;margin-top:6px}
.ok b{color:var(--pine)}
pre.host{white-space:pre-wrap;background:#fff;border:1px dashed var(--line);border-radius:12px;padding:12px;font:14px/1.45 'Onest',sans-serif;color:var(--ink2);margin:10px 0 0}
.err{color:#b23b2b;font-size:14px}
:focus-visible{outline:3px solid #a9c9b3;outline-offset:1px}
@media(min-width:640px){.grid{grid-template-columns:1fr 1fr 1fr}.card.wifi{grid-row:span 2}}
</style>
</head>
<body>
<div id="demoBar" class="demo" hidden>Демо-версия «Домового»: глэмпинг и контакты вымышленные</div>
<div class="wrap">
  <div class="hero">
    <p class="kind" id="kind"></p>
    <h1 id="name"></h1>
    <p class="place" id="place"></p>

  </div>

  <h2>Можно заказать</h2>
  <p class="sub">Заявка сразу уйдёт хозяину, он подтвердит время.</p>

  <div id="sections"></div>

  <h2>Понравилось у нас?</h2>

  <footer>Работает на <b>«Домовой»</b> — цифровой помощник гостя</footer>
</div>

<button class="fab" id="fab" type="button">Спросить о доме</button>
<div class="sheet-bg" id="bg"></div>
<div class="sheet" id="chat" role="dialog" aria-label="Вопрос о доме">
  <div class="sh-top"><b>Спросите о доме</b><button class="x" type="button" data-close aria-label="Закрыть">×</button></div>
  <div class="msgs" id="msgs"></div>
  <div class="sugg" id="sugg"></div>
  <form class="inp" id="askForm"><input id="q" maxlength="300" placeholder="Например: как включить отопление?" autocomplete="off"><button class="btn pine" type="submit">→</button></form>
  <div class="live" id="live"></div>
</div>
<div class="sheet" id="orderSheet" role="dialog" aria-label="Заказ услуги">
  <div class="sh-top"><b id="oTitle">Заказ</b><button class="x" type="button" data-close aria-label="Закрыть">×</button></div>
  <div class="form" id="oBody"></div>
</div>

<script>
const D = {"slug": "lesnaya-polyana", "name": "Лесная поляна", "kind": "Глэмпинг", "place": "Ленинградская область, Приозерский район", "welcome": "Добро пожаловать! Здесь всё, что пригодится за время отдыха. Не нашли ответ — спросите в чате внизу или напишите нам.", "host": {"name": "Анна", "phone": "+7 900 123-45-67", "messengers": "Telegram и MAX", "hours": "с 9:00 до 22:00", "night": "Срочно ночью — звоните, ответим", "telegram": "lesnaya_polyana", "max": "https://max.ru/"}, "checkin": "с 15:00", "checkout": "до 12:00", "map": "https://yandex.ru/maps/?text=Приозерский%20район", "reviews": [{"title": "Отзыв на Авито", "url": "https://www.avito.ru"}, {"title": "Отзыв на Яндекс Картах", "url": "https://yandex.ru/maps"}], "houses": [{"id": "sosna", "name": "Сосна", "guests": "до 2 гостей", "wifi": {"ssid": "Polyana_Sosna", "pass": "sosna2026"}, "note": "В домике печь-буржуйка: как топить — в разделе «Как всё работает»."}, {"id": "el", "name": "Ель", "guests": "до 4 гостей", "wifi": {"ssid": "Polyana_El", "pass": "el2026"}, "note": "В домике кондиционер и электрокамин: пульты лежат на полке у телевизора."}, {"id": "bereza", "name": "Берёза", "guests": "до 6 гостей", "wifi": {"ssid": "Polyana_Bereza", "pass": "bereza2026"}, "note": "Детская кроватка и стульчик — в шкафу у входа. Детская площадка прямо у крыльца."}], "sections": [{"id": "road", "title": "Как добраться", "items": ["В навигаторе: «Лесная поляна, Приозерский район». Кнопка «Маршрут» откроет Яндекс Карты.", "Последние 2 км — грунтовка. После дождя проезжает любая машина, зимой дорогу чистим.", "Ворота открываются кодом 2580#.", "Парковка у ворот — по одному месту на домик."]}, {"id": "check", "title": "Заселение и выезд", "items": ["Заезд с 15:00, выезд до 12:00.", "Ключ — в сейфе у двери домика. Код придёт сообщением в день заезда.", "Ранний заезд и поздний выезд можно заказать ниже, если домик свободен.", "Перед выездом вынесите мусор в контейнер у парковки и оставьте ключ в сейфе. Посуду мыть не обязательно."]}, {"id": "house", "title": "Как всё работает", "items": ["Отопление: тёплый пол включается на панели у входа, комфортно — 24 °C.", "Печь в «Сосне»: растопка и дрова у крыльца, заслонку держите открытой, пока дрова не прогорят полностью.", "Горячая вода — бойлер, нагревается за 40 минут. Если вода закончилась, подождите.", "Пропал свет — щиток в прихожей справа, поднимите выбитый автомат. Не помогло — звоните.", "Вода из-под крана техническая, питьевая — в кулере.", "Септик: в унитаз только туалетная бумага."]}, {"id": "where", "title": "Где что лежит", "items": ["Полотенца и постельное бельё — в шкафу в спальне.", "Запас туалетной бумаги и моющих средств — под раковиной в ванной.", "Кофе, чай, соль, сахар, масло — в верхнем шкафу на кухне.", "Фен и утюг — в шкафу в прихожей.", "Аптечка и огнетушитель — на кухне у двери."]}, {"id": "banya", "title": "Баня и чан", "items": ["Баня на дровах на берегу, до 6 человек. Затопим к нужному времени — закажите ниже, лучше за 3 часа.", "Чан греется 3 часа, заказывайте заранее.", "Простыни и полотенца для бани — в предбаннике.", "После бани не купайтесь в озере в темноте и после алкоголя."]}, {"id": "fire", "title": "Мангал и костёр", "items": ["Мангал и решётка — у каждого домика.", "Одна сетка дров — бесплатно при заезде, дальше можно заказать.", "Костёр — только в кострище у озера. При особом противопожарном режиме костры запрещены, объявление повесим на воротах.", "Уголь и розжиг можно заказать."]}, {"id": "area", "title": "Территория", "items": ["Озеро с пирсом — 150 м по тропе.", "Прокат сапов и лодки — на пирсе.", "Детская площадка и гамаки — у домика «Берёза».", "Беседка на 10 человек — бронируется бесплатно, напишите нам."]}, {"id": "rules", "title": "Правила", "items": ["Тишина с 23:00 до 8:00 — у нас отдыхают семьи с детьми.", "Курить можно только у кострища.", "С животными (собаки, кошки) можно, предупредите заранее.", "Гости со стороны — по согласованию.", "Фейерверки запрещены."]}, {"id": "food", "title": "Еда и магазины", "items": ["Завтрак привезём к домику в 9:00, заказ до 21:00 накануне.", "Ближайший продуктовый магазин — в посёлке в 6 км, работает до 23:00. Аптека и банкомат там же.", "Кафе на берегу — 3 км, есть доставка.", "Доставка продуктов сюда не доезжает — лучше закупиться заранее."]}, {"id": "around", "title": "Чем заняться рядом", "items": ["Пешая тропа вокруг озера — 5 км, около полутора часов.", "Крепость Корела в Приозерске — 25 км.", "Грибы и ягоды — в августе и сентябре, в лесу за домиком «Ель».", "В дождь — настольные игры в шкафу в гостиной."]}, {"id": "safety", "title": "Безопасность", "items": ["Пожар — звоните 112, затем нам.", "Клещи активны с апреля по октябрь: осматривайтесь после леса, пинцет в аптечке.", "Ближайший травмпункт — больница в Приозерске, 25 км.", "Купаться — только у пирса. Детей у воды без присмотра не оставляйте."]}, {"id": "after", "title": "После отдыха", "items": ["Будем рады отзыву — ссылки внизу страницы.", "В следующий раз бронируйте напрямую у нас — скидка 10%."]}], "services": [{"id": "banya", "name": "Баня на дровах", "price": "2 000 ₽", "unit": "за 2 часа", "ask_time": true}, {"id": "chan", "name": "Чан под открытым небом", "price": "3 500 ₽", "unit": "сеанс", "ask_time": true}, {"id": "breakfast", "name": "Завтрак к домику", "price": "600 ₽", "unit": "на человека", "ask_time": false}, {"id": "late", "name": "Поздний выезд", "price": "1 000 ₽", "unit": "до 15:00", "ask_time": false}, {"id": "extend", "name": "Остаться ещё на ночь", "price": "по датам", "unit": "уточним свободные дни", "ask_time": false}, {"id": "sup", "name": "Прокат сапа", "price": "700 ₽", "unit": "в час", "ask_time": true}, {"id": "wood", "name": "Дрова", "price": "400 ₽", "unit": "сетка", "ask_time": false}, {"id": "veniki", "name": "Берёзовый веник", "price": "300 ₽", "unit": "штука", "ask_time": false}, {"id": "early", "name": "Ранний заезд", "price": "1 000 ₽", "unit": "с 12:00", "ask_time": false}], "current": "el", "demo": true, "api": false};
let cur = D.current || null, curSvc = null;
const $ = id => document.getElementById(id);
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const H = () => D.houses.find(h=>h.id===cur) || null;
const MSG_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-5A8 8 0 1 1 21 12z"/></svg>';
const PHONE_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>';
function contactButtons(small){
  const h=D.host, tel=h.phone.replace(/[^\d+]/g,''), out=[];
  if(h.telegram) out.push(`<a class="btn tg" data-msgr href="https://t.me/${esc(h.telegram)}" target="_blank" rel="noopener">${MSG_ICON}Telegram</a>`);
  if(h.max) out.push(`<a class="btn mx" data-msgr href="${esc(h.max)}" target="_blank" rel="noopener">${MSG_ICON}MAX</a>`);
  out.push(`<a class="btn ${small?'ghost':'pine'}" href="tel:${esc(tel)}">${PHONE_ICON}Позвонить</a>`);
  return out.join('');
}
// в демо ссылки на мессенджеры ведут в никуда — объясняем вместо перехода
document.addEventListener('click',e=>{ const a=e.target.closest('[data-msgr]'); if(a && D.demo){ e.preventDefault(); alert('В рабочей версии здесь откроется чат с хозяином в мессенджере.'); } });

function renderHero(){
  $('demoBar').hidden = !D.demo;
  $('kind').textContent = D.kind; $('name').textContent = D.name; $('place').textContent = D.place; $('welcome').textContent = D.welcome;
  $('houses').innerHTML = `<button type="button" data-h="" class="${cur?'':'on'}">Вся территория</button>` +
    D.houses.map(h=>`<button type="button" data-h="${h.id}" class="${cur===h.id?'on':''}">Домик «${esc(h.name)}»</button>`).join('');
  $('houses').querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{ cur=b.dataset.h||null;
    try{ if(D.api) history.replaceState(null,'',`/${D.slug}${cur?'/'+cur:''}`);}catch(e){}
    renderHero(); renderQuick(); });
  const on=$('houses').querySelector('.on'); if(on && cur) $('houses').scrollLeft = on.offsetLeft - 16;
}
function renderQuick(){
  const h=H(), host=D.host; let out='';
  out += h ? `<div class="card wifi"><p class="lbl">Wi-Fi · домик «${esc(h.name)}»</p><p class="ssid">Сеть: ${esc(h.wifi.ssid)}</p><p class="pass">${esc(h.wifi.pass)}</p><button class="btn light" type="button" id="copy">Скопировать пароль</button></div>`
           : `<div class="card wifi"><p class="lbl">Wi-Fi</p><p class="pass" style="font-size:17px">Выберите свой домик выше — покажем сеть и пароль</p></div>`;
  out += `<div class="card"><p class="lbl">Заезд</p><p class="big">${esc(D.checkin)}</p></div>`;
  out += `<div class="card"><p class="lbl">Выезд</p><p class="big">${esc(D.checkout)}</p></div>`;
  out += `<div class="card wide"><p class="lbl">На связи</p><p class="big">${esc(host.name)}, ${esc(host.hours)}</p><p class="sub" style="margin:4px 0 0">${esc(host.messengers)}. ${esc(host.night)}.</p>
    <div class="row">${contactButtons(false)}<a class="btn ghost" href="${esc(D.map)}" target="_blank" rel="noopener">Маршрут</a></div></div>`;
  if(h) out += `<div class="card wide note">${esc(h.note)}</div>`;
  $('quick').innerHTML = out;
  const c=$('copy'); if(c) c.onclick=async()=>{ try{ await navigator.clipboard.writeText(h.wifi.pass); c.textContent='Скопировано ✓'; }catch(e){ c.textContent='Пароль: '+h.wifi.pass; } };
}
function renderServices(){
  $('services').innerHTML = D.services.map(s=>`<div class="item"><div class="t"><b>${esc(s.name)}</b><span>${esc(s.unit)}</span></div><span class="p">${esc(s.price)}</span><button class="btn wood" type="button" data-svc="${s.id}">Заказать</button></div>`).join('');
  $('services').querySelectorAll('[data-svc]').forEach(b=>b.onclick=()=>openOrder(b.dataset.svc));
}
function renderSections(q=''){
  const words = q.toLowerCase().split(/\s+/).filter(w=>w.length>2).map(w=>w.slice(0,5));
  const hit = t => words.length && words.some(w=>t.toLowerCase().includes(w));
  const mk = t => { if(!words.length) return esc(t); let s=esc(t); words.forEach(w=>{ s=s.replace(new RegExp('('+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'[а-яёa-z]*)','gi'),'<mark>$1</mark>'); }); return s; };
  let html='';
  for(const sec of D.sections){
    const items = words.length ? sec.items.filter(i=>hit(i)||hit(sec.title)) : sec.items;
    if(!items.length) continue;
    html += `<details ${words.length?'open':''}><summary>${esc(sec.title)}</summary><ul>${items.map(i=>`<li>${mk(i)}</li>`).join('')}</ul></details>`;
  }
  $('sections').innerHTML = html || `<p class="empty">Ничего не нашли. Спросите в чате — кнопка внизу экрана.</p>`;
}
function renderReviews(){ $('reviews').innerHTML = (D.reviews||[]).map(r=>`<a class="btn ghost" href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.title)}</a>`).join(''); }

// ---------- шторки ----------
function openSheet(id){ $('bg').classList.add('open'); $(id).classList.add('open'); }
function closeSheets(){ $('bg').classList.remove('open'); document.querySelectorAll('.sheet').forEach(s=>s.classList.remove('open')); }
$('bg').onclick=closeSheets; document.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeSheets);
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeSheets(); });

async function post(url, body){
  const r = await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j = await r.json().catch(()=>({})); if(!r.ok) throw new Error(j.error||'Не получилось, попробуйте ещё раз'); return j;
}

// ---------- заказ ----------
function openOrder(id){
  curSvc = D.services.find(s=>s.id===id); $('oTitle').textContent = curSvc.name;
  const houseChips = D.houses.map(h=>`<button type="button" data-oh="${h.id}" class="${cur===h.id?'on':''}">«${esc(h.name)}»</button>`).join('');
  $('oBody').innerHTML = `<p class="sub" style="margin:0">${esc(curSvc.price)} · ${esc(curSvc.unit)}</p>
    <label>Ваш домик</label><div class="chips" id="oHouses">${houseChips}</div>
    ${curSvc.ask_time?`<label for="oWhen">Когда удобно</label><input id="oWhen" placeholder="например, сегодня в 18:00">`:''}
    <label for="oCom">Комментарий <span style="font-weight:400;color:var(--muted)">— необязательно</span></label><textarea id="oCom" maxlength="200" placeholder="Сколько человек, пожелания"></textarea>
    <button class="btn wood" type="button" id="oSend" style="width:100%;margin-top:14px">Отправить заявку хозяину</button><p class="err" id="oErr" hidden></p>`;
  $('oHouses').querySelectorAll('[data-oh]').forEach(b=>b.onclick=()=>{ $('oHouses').querySelectorAll('button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); });
  $('oSend').onclick = sendOrder; openSheet('orderSheet');
}
async function sendOrder(){
  const hb = $('oHouses').querySelector('.on'); const body = {slug:D.slug, house:hb?hb.dataset.oh:null, service:curSvc.id, when:($('oWhen')||{}).value||'', comment:$('oCom').value};
  if(!body.house){ $('oErr').textContent='Выберите свой домик'; $('oErr').hidden=false; return; }
  let res;
  try{ res = D.api ? await post('/api/order', body) : null; }catch(e){ $('oErr').textContent=e.message; $('oErr').hidden=false; return; }
  if(!res){ const h=D.houses.find(x=>x.id===body.house); res={demo:true, host_message:`Новая заявка — ${D.name}\n${curSvc.name} (${curSvc.price} ${curSvc.unit})\nДомик: «${h.name}»`+(body.when?`\nКогда: ${body.when}`:'')+(body.comment?`\nКомментарий: ${body.comment}`:'')}; }
  $('oBody').innerHTML = `<div class="ok"><b>Заявка отправлена</b><p style="margin:6px 0 0;line-height:1.45">${esc(D.host.name)} получит её и подтвердит время. Если срочно — позвоните ${esc(D.host.phone)}.</p></div>`
    + (res.demo ? `<p class="sub" style="margin:14px 0 0">Так заявка придёт хозяину:</p><pre class="host">${esc(res.host_message)}</pre>` : '')
    + `<button class="btn ghost" type="button" style="width:100%;margin-top:14px" data-close2>Готово</button>`;
  $('oBody').querySelector('[data-close2]').onclick=closeSheets;
}

// ---------- ИИ-чат ----------
const SUGG = ['Какой пароль от Wi-Fi?','Как затопить баню?','Где взять дрова?','До скольки выезд?','Как включить отопление?','Где ближайший магазин?'];
function addMsg(t, who){ const m=document.createElement('div'); m.className='m '+who; m.textContent=t; $('msgs').appendChild(m); $('msgs').scrollTop=1e6; return m; }
const STOPW=new Set(['есть','если','можно','ли','где','как','когда','что','это','для','или','мне','нам','вас','при','чем','какой','какая','какие','сколько','скольки','нужно','надо','тут','здесь','там','все','будет','может','хочу','хотим','подскажите','скажите','у','до','в','на','с','по','а','и','не','ещё','еще']);
const END=/(ями|ами|ого|его|ому|ему|ыми|ими|ой|ей|ом|ем|ам|ям|ах|ях|ую|юю|ая|яя|ое|ее|ые|ие|ый|ий|ов|ев|а|я|у|ю|е|ы|и|о|ь)$/;
const stems=t=>new Set((t.toLowerCase().replace(/ё/g,'е').match(/[а-яa-z0-9]+/g)||[]).filter(w=>!STOPW.has(w)).map(w=>w.replace(END,'').slice(0,5)).filter(w=>w.length>=3));
function localAnswer(q){
  const h=H();
  if(/wi-?fi|вай|интернет|пароль/i.test(q)) return h?`Wi-Fi в домике «${h.name}»: сеть ${h.wifi.ssid}, пароль ${h.wifi.pass}.`:'Выберите свой домик вверху страницы — покажем сеть и пароль Wi-Fi.';
  const items=D.sections.flatMap(s=>s.items), st=items.map(stems), df={}; st.forEach(x=>x.forEach(w=>df[w]=(df[w]||0)+1));
  const qs=stems(q); let best=-1, bs=0;
  st.forEach((x,i)=>{ const hit=[...qs].filter(w=>x.has(w)); if(!hit.length) return; const sc=hit.reduce((a,w)=>a+1/df[w],0)+0.3*hit.length/x.size; if(sc>bs){bs=sc;best=i;} });
  return bs>=0.3 ? items[best] : `Этого в путеводителе нет. Лучше уточнить у хозяина: ${D.host.name}, ${D.host.phone}.`;
}
async function ask(q){
  q=q.trim(); if(!q) return; addMsg(q,'me'); $('q').value=''; const wait=addMsg('…','bot');
  try{ const j = D.api ? await post('/api/chat',{slug:D.slug,house:cur,q}) : {answer:localAnswer(q)}; wait.textContent=j.answer; }
  catch(e){ wait.textContent = e.message.includes('Слишком') ? e.message : localAnswer(q); }
}
$('fab').onclick=()=>{ if(!$('msgs').children.length) addMsg(`Здравствуйте! Я помогу с вопросами о «${D.name}»: Wi-Fi, баня, мангал, магазины рядом. Что подсказать?`,'bot'); openSheet('chat'); setTimeout(()=>$('q').focus(),50); };
$('sugg').innerHTML = SUGG.map(s=>`<button type="button">${s}</button>`).join(''); $('sugg').querySelectorAll('button').forEach(b=>b.onclick=()=>ask(b.textContent));
$('askForm').onsubmit=e=>{ e.preventDefault(); ask($('q').value); };
$('search').oninput=e=>renderSections(e.target.value);

$('live').innerHTML = '<span>Нужен живой человек?</span>' + contactButtons(true);
renderHero(); renderQuick(); renderServices(); renderSections(); renderReviews();
</script>
