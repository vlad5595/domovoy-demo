<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Глэмпинг «Лесная поляна» — путеводитель гостя (демо)</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏡</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=PT+Serif:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2ec;--card:#fff;--ink:#1f3326;--ink2:#3c5143;--muted:#6b7d6f;--line:#d6dfd7;--pine:#2f5d43;--pine-s:#e1ece3;--wood:#b8692f;--wood-s:#f7ebe0;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 120px}
.demo{background:var(--wood-s);color:#7a4518;font-size:12.5px;text-align:center;padding:7px 12px}
.hero{padding:26px 0 14px}
.kind{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0}
h1{font-family:'PT Serif',Georgia,serif;font-size:clamp(30px,8vw,42px);line-height:1.05;margin:6px 0 6px;color:var(--pine)}
.place{color:var(--muted);font-size:14px;margin:0 0 14px}
.welcome{font-size:15.5px;line-height:1.5;color:var(--ink2);margin:0}
.houses{display:flex;gap:8px;overflow-x:auto;padding:16px 0 4px;scrollbar-width:none}
.houses[hidden]{display:none}
.houses button{flex:0 0 auto;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:9px 16px;cursor:pointer;font-size:14.5px;font-weight:500}
.houses button.on{background:var(--pine);border-color:var(--pine);color:#fff}
.tabs{position:sticky;top:0;z-index:20;display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--bg);padding:8px 0 10px;margin-top:10px;border-bottom:1px solid var(--line)}
.tabs button{border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:11px 8px;font-weight:600;font-size:15px;cursor:pointer;line-height:1.2}
.tabs button small{display:block;font-weight:400;font-size:12px;color:var(--muted);margin-top:2px}
.tabs button.on{background:var(--pine);border-color:var(--pine);color:#fff}.tabs button.on small{color:#cfe2d4}
.tag{font-size:11.5px;font-weight:500;color:var(--muted);background:var(--pine-s);border-radius:999px;padding:2px 8px;margin-left:8px;white-space:nowrap}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 15px}
.card.wide{grid-column:1/-1}
.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 6px}
.big{font-size:17px;font-weight:600;margin:0}
.wifi{background:var(--pine);color:#fff;border:0}
.wifi .lbl{color:#bcd3c3}.wifi .pass{font-size:22px;font-weight:700;letter-spacing:.02em;margin:2px 0 10px;word-break:break-all}
.wifi .ssid{font-size:14px;color:#d6e6da;margin:0}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:600;cursor:pointer;font-size:15px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.light{background:#fff;color:var(--pine)}.btn.pine{background:var(--pine);color:#fff}.btn.wood{background:var(--wood);color:#fff}
.btn.ghost{background:var(--pine-s);color:var(--pine)}
.btn.tg{background:#2aabee;color:#fff}.btn.mx{background:#5b3fd9;color:#fff}
.btn svg{width:18px;height:18px;flex:0 0 auto}
.live{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:0 16px 14px;font-size:13.5px;color:var(--muted)}
.live .btn{padding:8px 12px;font-size:14px;border-radius:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.note{background:var(--wood-s);border-color:#efd8c2;font-size:14.5px;line-height:1.45;color:#5e3a17}
h2{font-size:21px;margin:30px 0 4px}
.sub{color:var(--muted);font-size:14px;margin:0 0 12px}
.svc{display:grid;gap:8px}
.svc .item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 12px 12px 15px}
.svc .t{flex:1;min-width:0}.svc b{display:block;font-size:15.5px}.svc span{font-size:13px;color:var(--muted)}
.svc .p{font-weight:700;color:var(--wood);white-space:nowrap;font-size:15px}
.search{width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:13px 15px;font-size:16px;margin:4px 0 12px}
.search:focus{outline:none;border-color:var(--pine)}
details{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;overflow:hidden}
summary{cursor:pointer;list-style:none;padding:15px 16px;font-weight:600;font-size:16px;display:flex;justify-content:space-between;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:'+';font-size:22px;color:var(--muted);line-height:1}
details[open] summary::after{content:'–'}
details ul{margin:0;padding:0 16px 14px 34px}
details li{margin:0 0 8px;line-height:1.5;font-size:15px;color:var(--ink2)}
mark{background:#ffe9a8;border-radius:3px;padding:0 2px}
.empty{color:var(--muted);font-size:14px;padding:6px 2px}
.reviews{display:grid;gap:8px;margin-top:8px}
footer{text-align:center;color:var(--muted);font-size:12.5px;margin-top:36px}
footer b{color:var(--pine)}
/* чат */
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--pine);color:#fff;border:0;border-radius:999px;padding:14px 20px;font-weight:600;font-size:15.5px;box-shadow:0 10px 28px -8px rgba(31,51,38,.55);cursor:pointer;z-index:20}
.sheet-bg{position:fixed;inset:0;background:rgba(20,32,24,.45);z-index:30;display:none}
.sheet-bg.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:720px;margin:0 auto;background:var(--bg);border-radius:20px 20px 0 0;z-index:31;max-height:88vh;display:none;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.open{display:flex}
.sh-top{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 8px}
.sh-top b{font-size:17px}.x{border:0;background:none;font-size:26px;line-height:1;color:var(--muted);cursor:pointer}
.msgs{flex:1;overflow-y:auto;padding:4px 16px 8px;display:flex;flex-direction:column;gap:8px;min-height:180px}
.m{max-width:86%;padding:10px 13px;border-radius:16px;font-size:15px;line-height:1.45}
.m.me{align-self:flex-end;background:var(--pine);color:#fff;border-bottom-right-radius:4px}
.m.bot{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.sugg{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 8px}
.sugg button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-size:13.5px;cursor:pointer}
.inp{display:flex;gap:8px;padding:8px 16px 14px}
.inp input{flex:1;border:1.5px solid var(--line);border-radius:12px;padding:12px 13px;font-size:16px;background:var(--card)}
.inp input:focus{outline:none;border-color:var(--pine)}
.form{padding:0 16px 18px;overflow-y:auto}
.form label{display:block;font-size:13.5px;font-weight:600;margin:12px 0 6px}
.form input,.form textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px;font-size:16px;background:var(--card)}
.form textarea{min-height:70px;resize:vertical}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 13px;font-size:14px;cursor:pointer}
.chips button.on{border-color:var(--pine);background:var(--pine-s);color:var(--pine);font-weight:600}
.ok{background:var(--pine-s);border-radius:14px;padding:14px;margin-top:6px}
.ok b{color:var(--pine)}
pre.host{white-space:pre-wrap;background:#fff;border:1px dashed var(--line);border-radius:12px;padding:12px;font:14px/1.45 'Onest',sans-serif;color:var(--ink2);margin:10px 0 0}
.err{color:#b23b2b;font-size:14px}
:focus-visible{outline:3px solid #a9c9b3;outline-offset:1px}
@media(min-width:640px){.grid{grid-template-columns:1fr 1fr 1fr}.card.wifi{grid-row:span 2}}
</style>
</head>
<body>
<div id="demoBar" class="demo" hidden>Демо-версия «Домового»: глэмпинг и контакты вымышленные</div>
<div class="wrap">
  <div class="hero">
    <p class="kind" id="kind"></p>
    <h1 id="name"></h1>
    <p class="place" id="place"></p>
    <p class="welcome" id="welcome"></p>
    <div class="houses" id="houses" role="tablist" aria-label="Выбор домика"></div>
  </div>
  <div class="tabs" id="tabs" role="tablist" aria-label="Раздел путеводителя">
    <button type="button" role="tab" data-tab="pre">Перед приездом<small>дорога, заезд, правила</small></button>
    <button type="button" role="tab" data-tab="home">В доме<small>Wi-Fi, инструкции, услуги</small></button>
  </div>
  <div class="grid" id="quick"></div>

  <h2 id="svcTitle">Можно заказать</h2>
  <p class="sub" id="svcSub">Заявка сразу уйдёт хозяину, он подтвердит время.</p>
  <div class="svc" id="services"></div>

  <h2 id="secTitle">Всё о доме и территории</h2>
  <input class="search" id="search" type="search" placeholder="Найти: дрова, котёл, пароль, магазин…" aria-label="Поиск по путеводителю">
  <div id="sections"></div>

  <div id="revBox">
  <h2>Понравилось у нас?</h2>
  <p class="sub">Отзыв помогает другим гостям найти нас.</p>
  <div class="reviews" id="reviews"></div>
  </div>

  <footer>Работает на <b>«Домовой»</b> — цифровой помощник гостя</footer>
</div>

<button class="fab" id="fab" type="button">Спросить о доме</button>
<div class="sheet-bg" id="bg"></div>
<div class="sheet" id="chat" role="dialog" aria-label="Вопрос о доме">
  <div class="sh-top"><b>Спросите о доме</b><button class="x" type="button" data-close aria-label="Закрыть">×</button></div>
  <div class="msgs" id="msgs"></div>
  <div class="sugg" id="sugg"></div>
  <form class="inp" id="askForm"><input id="q" maxlength="300" placeholder="Например: как включить отопление?" autocomplete="off"><button class="btn pine" type="submit">→</button></form>
  <div class="live" id="live"></div>
</div>
<div class="sheet" id="orderSheet" role="dialog" aria-label="Заказ услуги">
  <div class="sh-top"><b id="oTitle">Заказ</b><button class="x" type="button" data-close aria-label="Закрыть">×</button></div>
  <div class="form" id="oBody"></div>
</div>

<script>
const D = {"slug": "lesnaya-polyana", "name": "Лесная поляна", "kind": "Глэмпинг", "place": "Ленинградская область, Приозерский район", "welcome": "Добро пожаловать! Здесь всё, что пригодится за время отдыха. Не нашли ответ — спросите в чате внизу или напишите нам.", "host": {"name": "Анна", "phone": "+7 900 123-45-67", "messengers": "Telegram и MAX", "hours": "с 9:00 до 22:00", "night": "Срочно ночью — звоните, ответим", "telegram": "lesnaya_polyana", "max": "https://max.ru/"}, "checkin": "с 15:00", "checkout": "до 12:00", "map": "https://yandex.ru/maps/?text=Приозерский%20район", "reviews": [{"title": "Отзыв на Авито", "url": "https://www.avito.ru"}, {"title": "Отзыв на Яндекс Картах", "url": "https://yandex.ru/maps"}], "houses": [{"id": "sosna", "name": "Сосна", "guests": "до 2 гостей", "wifi": {"ssid": "Polyana_Sosna", "pass": "sosna2026"}, "note": "В домике печь-буржуйка: как топить — в разделе «Как всё работает»."}, {"id": "el", "name": "Ель", "guests": "до 4 гостей", "wifi": {"ssid": "Polyana_El", "pass": "el2026"}, "note": "В домике кондиционер и электрокамин: пульты лежат на полке у телевизора."}, {"id": "bereza", "name": "Берёза", "guests": "до 6 гостей", "wifi": {"ssid": "Polyana_Bereza", "pass": "bereza2026"}, "note": "Детская кроватка и стульчик — в шкафу у входа. Детская площадка прямо у крыльца."}], "sections": [{"id": "road", "title": "Как добраться", "items": ["В навигаторе: «Лесная поляна, Приозерский район». Кнопка «Маршрут» откроет Яндекс Карты.", "Последние 2 км — грунтовка. После дождя проезжает любая машина, зимой дорогу чистим.", "Лучше приехать до темноты: на последних километрах нет освещения.", "Ворота откроем мы: код придёт сообщением в день заезда.", "Парковка у ворот — по одному месту на домик.", "Заблудились или опаздываете — позвоните, подскажем дорогу."], "tab": "pre"}, {"id": "bring", "title": "Что взять с собой", "tab": "pre", "items": ["Тёплая одежда и дождевик: у озера вечером прохладно даже летом.", "Сменная обувь и резиновые та function renderSections(q=''){
  const words = q.toLowerCase().replace(/ё/g,'е').split(/\s+/).filter(w=>w.length>2&&!['как','что','где','для','или','мне','нам','там','тут'].includes(w)).map(w=>w.replace(/(ями|ами|ого|его|ому|ему|ой|ей|ом|ем|ам|ям|ах|ях|ую|ая|ое|ые|ий|ый|ов|а|я|у|ю|е|ы|и|о|ь)$/,'').slice(0,5)).filter(w=>w.length>=3);
  const hit = t => words.length && words.some(w=>t.toLowerCase().includes(w));
  const mk = t => { if(!words.length) return esc(t); let s=esc(t); words.forEach(w=>{ s=s.replace(new RegExp('('+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'[а-яёa-z]*)','gi'),'<mark>$1</mark>'); }); return s; };
  let html='';
  $('secTitle').textContent = tab==='pre' ? 'Всё, что нужно до приезда' : 'Всё о доме и территории';
  for(const sec of D.sections){
    if(!words.length && sec.tab && sec.tab!==tab) continue;
    const items = words.length ? sec.items.filter(i=>hit(i)||hit(sec.title)) : sec.items;
    if(!items.length) continue;
    const fig = (sec.id==='area' && D.scheme==='demo' && !words.length) ? `<figure style="margin:0 16px 12px">${SCHEME_DEMO}<figcaption style="font-size:13px;color:var(--muted);margin-top:6px">Схема территории. Нарисуем по вашему описанию или добавим ваши фото.</figcaption></figure>` : '';
    html += `<details ${words.length||(sec.id==='area'&&fig)?'open':''}><summary><span>${esc(sec.title)}${words.length&&sec.tab?`<span class="tag">${TAB_NAME[sec.tab]}</span>`:''}</span></summary>${fig}<ul>${items.map(i=>`<li>${mk(i)}</li>`).join('')}</ul></details>`;
  }
  const wifiQ = /wi-?fi|вай|интернет|парол/i.test(q);
  $('sections').innerHTML = (wifiQ ? `<p class="empty">Пароль Wi-Fi — в зелёной карточке вверху страницы. ${cur?'':'Сначала выберите свой домик.'}</p>` : '') + (html || (wifiQ ? '' : `<p class="empty">Ничего не нашли. Спросите в чате — кнопка внизу экрана.</p>`));
}

  if(!body.house && tab!=='pre'){ $('oErr').textContent='Выберите свой домик'; $('oErr').hidden=false; return; }
  let res;
  try{ res = D.api ? await post('/api/order', body) : null; }catch(e){ $('oErr').textContent=e.message; $('oErr').hidden=false; return; }
  if(!res){ const h=D.houses.find(x=>x.id===body.house); res={demo:true, host_message:`Новая заявка${body.pre?' (до приезда)':''} — ${D.name}\n${curSvc.name} (${curSvc.price} ${curSvc.unit})\nДомик: ${h?'«'+h.name+'»':'пока не указан'}`+(body.when?`\nКогда: ${body.when}`:'')+(body.comment?`\nКомментарий: ${body.comment}`:'')}; }
  $('oBody').innerHTML = `<div class="ok"><b>Заявка отправлена</b><p style="margin:6px 0 0;line-height:1.45">${esc(D.host.name)} получит её и подтвердит время. Если срочно — позвоните ${esc(D.host.phone)}.</p></div>`
    + (res.demo ? `<p class="sub" style="margin:14px 0 0">Так заявка придёт хозяину:</p><pre class="host">${esc(res.host_message)}</pre>` : '')
    + `<button class="btn ghost" type="button" style="width:100%;margin-top:14px" data-close2>Готово</button>`;
  $('oBody').querySelector('[data-close2]').onclick=closeSheets;
}

// ---------- ИИ-чат ----------
const SUGG_HOME = ['Какой пароль от Wi-Fi?','Как затопить баню?','Где взять дрова?','До скольки выезд?','Как включить отопление?','Где ближайший магазин?'];
const SUGG_PRE = ['Как доехать?','Что взять с собой?','Во сколько заезд?','Можно с собакой?','Где купить продукты?','Как заказать баню?'];
function addMsg(t, who){ const m=document.createElement('div'); m.className='m '+who; m.textContent=t; $('msgs').appendChild(m); $('msgs').scrollTop=1e6; return m; }
const STOPW=new Set(['есть','если','можно','ли','где','как','когда','что','это','для','или','мне','нам','вас','при','чем','какой','какая','какие','сколько','скольки','нужно','надо','тут','здесь','там','все','будет','может','хочу','хотим','подскажите','скажите','у','до','в','на','с','по','а','и','не','ещё','еще']);
const END=/(ями|ами|ого|его|ому|ему|ыми|ими|ой|ей|ом|ем|ам|ям|ах|ях|ую|юю|ая|яя|ое|ее|ые|ие|ый|ий|ов|ев|а|я|у|ю|е|ы|и|о|ь)$/;
const stems=t=>new Set((t.toLowerCase().replace(/ё/g,'е').match(/[а-яa-z0-9]+/g)||[]).filter(w=>!STOPW.has(w)).map(w=>w.replace(END,'').slice(0,5)).filter(w=>w.length>=3));
function localAnswer(q){
  const h=H();
  if(/wi-?fi|вай|интернет|пароль/i.test(q)) return tab==='pre' ? 'Пароль Wi-Fi покажем в домике: наведите камеру на QR-карточку или откройте вкладку «В доме».' : h?`Wi-Fi в домике «${h.name}»: сеть ${h.wifi.ssid}, пароль ${h.wifi.pass}.`:'Выберите свой домик вверху страницы — покажем сеть и пароль Wi-Fi.';
  const items=D.sections.flatMap(s=>s.items), st=items.map(stems), df={}; st.forEach(x=>x.forEach(w=>df[w]=(df[w]||0)+1));
  const qs=stems(q); let best=-1, bs=0;
  st.forEach((x,i)=>{ const hit=[...qs].filter(w=>x.has(w)); if(!hit.length) return; const sc=hit.reduce((a,w)=>a+1/df[w],0)+0.3*hit.length/x.size; if(sc>bs){bs=sc;best=i;} });
  return bs>=0.3 ? items[best] : `Этого в путеводителе нет. Лучше уточнить у хозяина: ${D.host.name}, ${D.host.phone}.`;
}
async function ask(q){
  q=q.trim(); if(!q) return; addMsg(q,'me'); $('q').value=''; const wait=addMsg('…','bot');
  try{ const j = D.api ? await post('/api/chat',{slug:D.slug,house:cur,q}) : {answer:localAnswer(q)}; wait.textContent=j.answer; }
  catch(e){ wait.textContent = e.message.includes('Слишком') ? e.message : localAnswer(q); }
}
$('fab').onclick=()=>{ if(!$('msgs').children.length) addMsg(tab==='pre' ? `Здравствуйте! Подскажу, как доехать к «${D.name}», что взять с собой и как заказать услуги заранее. Что интересует?` : `Здравствуйте! Я помогу с вопросами о «${D.name}»: Wi-Fi, баня, мангал, магазины рядом. Что подсказать?`,'bot'); openSheet('chat'); setTimeout(()=>$('q').focus(),50); };
function renderSugg(){ $('sugg').innerHTML = (tab==='pre'?SUGG_PRE:SUGG_HOME).map(s=>`<button type="button">${s}</button>`).join(''); $('sugg').querySelectorAll('button').forEach(b=>b.onclick=()=>ask(b.textContent)); }
$('askForm').onsubmit=e=>{ e.preventDefault(); ask($('q').value); };
$('search').oninput=e=>renderSections(e.target.value);

$('live').innerHTML = '<span>Нужен живой человек?</span>' + contactButtons(true);
function setTab(t, keepScroll){
  tab=t; try{ history.replaceState(null,'',(D.api?location.pathname:location.pathname)+'#'+t); }catch(e){}
  document.querySelectorAll('[data-tab]').forEach(b=>{ const on=b.dataset.tab===t; b.classList.toggle('on',on); b.setAttribute('aria-selected',on); });
  $('search').value=''; renderHero(); renderQuick(); renderServices(); renderSections(); renderReviews(); renderSugg();
  if(!keepScroll) window.scrollTo({top:0});
}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
window.addEventListener('hashchange',()=>{ const t=location.hash.replace('#',''); if((t==='pre'||t==='home')&&t!==tab) setTab(t); });
setTab(tab,true);
</script>
